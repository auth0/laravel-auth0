name: SCA

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  snyk-cli:
    uses: auth0/devsecops-tooling/.github/workflows/sca-scan.yml@e29f26478db18ff0bcbe4bc447a8fbd54fbeec9e # main on 2026-11-27, TODO: use a release instead
    with:
      php-version: "8.2"
      additional-arguments: "--exclude=vendor"
      pre-scan-commands: |
        composer install --no-interaction --prefer-dist
    secrets: inherit
